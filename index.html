<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤실장 | 골프웨어 & 수입 의류</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 팔레트 5색 */
      --p-terracotta: #D99771;  /* 웜 로즈골드 */
      --p-brown:      #A66953;  /* 미드 브라운 */
      --p-blush:      #F2BFAC;  /* 라이트 블러쉬 */
      --p-dark:       #733B2F;  /* 딥 다크브라운 */
      --p-cream:      #F2ECEB;  /* 크림화이트 (배경) */
      /* 골드 포인트 */
      --gold-light:   #F5E17A;
      --gold-mid:     #D4AF37;
      --gold-warm:    #C9A96E;
    }

    body {
      /* 크림 화이트 베이스: 로고 흰 배경 자연 흡수 */
      background-color: var(--p-cream);
      background-image:
        /* 상단 로즈골드 후광 */
        radial-gradient(ellipse 110% 55% at 50% -5%,
          rgba(242,191,172,0.60) 0%,
          rgba(217,151,113,0.30) 35%,
          transparent 65%
        ),
        /* 중앙 워밍 */
        radial-gradient(ellipse 80% 40% at 50% 50%,
          rgba(242,191,172,0.15) 0%,
          transparent 70%
        ),
        /* 하단 딥 포인트 */
        radial-gradient(ellipse 70% 30% at 50% 108%,
          rgba(166,105,83,0.18) 0%,
          transparent 65%
        );
      color: var(--p-dark);
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 0 80px;
      position: relative;
      overflow-x: hidden;
    }

    /* 스크롤 시 이동하는 광택 레이어 — 연한 코랄+화이트 */
    .sheen-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 20%, rgba(255,245,242,0.55) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 75% 65%, rgba(242,191,172,0.25) 0%, transparent 55%);
      will-change: transform;
    }

    /* SVG grain: 크림 배경에 미세 메탈릭 텍스처 */
    .grain {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      mix-blend-mode: multiply;
      opacity: 0.07;
    }

    /* 상단 딥브라운 밴드 */
    .top-band {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg,
        var(--p-dark), #5A2820, var(--p-dark), #5A2820, var(--p-dark)
      );
      z-index: 200;
    }

    /* ── Sparkles ── */
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .sp {
      position: absolute;
      color: var(--gold-mid);
      animation: sp-anim linear infinite;
      opacity: 0;
      user-select: none;
    }
    .sp:nth-child(1)  { left:  7%; top:12%;  font-size:16px;  animation-duration:4.2s; animation-delay:0.0s; }
    .sp:nth-child(2)  { left: 88%; top:18%;  font-size:22px;  animation-duration:5.8s; animation-delay:1.1s; }
    .sp:nth-child(3)  { left: 18%; top:42%;  font-size:14px;  animation-duration:5.0s; animation-delay:2.3s; }
    .sp:nth-child(4)  { left: 93%; top:52%;  font-size:20px;  animation-duration:6.5s; animation-delay:0.6s; }
    .sp:nth-child(5)  { left:  3%; top:68%;  font-size:26px;  animation-duration:4.8s; animation-delay:1.7s; }
    .sp:nth-child(6)  { left: 72%; top:77%;  font-size:18px;  animation-duration:5.3s; animation-delay:3.1s; }
    .sp:nth-child(7)  { left: 48%; top:10%;  font-size:24px;  animation-duration:6.1s; animation-delay:0.9s; }
    .sp:nth-child(8)  { left: 33%; top:88%;  font-size:16px;  animation-duration:4.6s; animation-delay:2.0s; }
    .sp:nth-child(9)  { left: 62%; top:48%;  font-size:14px;  animation-duration:5.4s; animation-delay:1.4s; }
    .sp:nth-child(10) { left: 22%; top:58%;  font-size:20px;  animation-duration:7.0s; animation-delay:0.4s; }
    .sp:nth-child(11) { left: 96%; top:32%;  font-size:18px;  animation-duration:3.9s; animation-delay:2.7s; }
    .sp:nth-child(12) { left: 44%; top:94%;  font-size:22px;  animation-duration:5.7s; animation-delay:0.7s; }
    .sp:nth-child(13) { left: 55%; top:28%;  font-size:14px;  animation-duration:4.4s; animation-delay:3.5s; }
    .sp:nth-child(14) { left: 11%; top:80%;  font-size:24px;  animation-duration:6.2s; animation-delay:1.9s; }
    .sp:nth-child(15) { left: 79%; top: 6%;  font-size:18px;  animation-duration:5.1s; animation-delay:0.2s; }
    .sp:nth-child(16) { left: 38%; top:22%;  font-size:28px;  animation-duration:4.9s; animation-delay:0.3s; }
    .sp:nth-child(17) { left: 65%; top:38%;  font-size:16px;  animation-duration:6.3s; animation-delay:1.6s; }
    .sp:nth-child(18) { left: 12%; top:25%;  font-size:20px;  animation-duration:5.5s; animation-delay:2.8s; }
    .sp:nth-child(19) { left: 82%; top:60%;  font-size:14px;  animation-duration:4.3s; animation-delay:0.5s; }
    .sp:nth-child(20) { left: 28%; top:72%;  font-size:22px;  animation-duration:5.9s; animation-delay:1.3s; }
    .sp:nth-child(21) { left: 58%; top:85%;  font-size:18px;  animation-duration:4.7s; animation-delay:3.8s; }
    .sp:nth-child(22) { left:  2%; top:35%;  font-size:26px;  animation-duration:6.4s; animation-delay:0.8s; }
    .sp:nth-child(23) { left: 76%; top:14%;  font-size:16px;  animation-duration:5.2s; animation-delay:2.1s; }
    .sp:nth-child(24) { left: 42%; top:55%;  font-size:20px;  animation-duration:4.5s; animation-delay:1.0s; }
    .sp:nth-child(25) { left: 90%; top:42%;  font-size:24px;  animation-duration:6.8s; animation-delay:3.3s; }
    .sp:nth-child(26) { left: 15%; top:92%;  font-size:18px;  animation-duration:5.6s; animation-delay:0.1s; }
    .sp:nth-child(27) { left: 68%; top:22%;  font-size:14px;  animation-duration:4.1s; animation-delay:2.5s; }
    .sp:nth-child(28) { left: 35%; top:38%;  font-size:22px;  animation-duration:5.8s; animation-delay:1.8s; }
    .sp:nth-child(29) { left: 52%; top:70%;  font-size:16px;  animation-duration:4.6s; animation-delay:3.0s; }
    .sp:nth-child(30) { left: 85%; top:88%;  font-size:20px;  animation-duration:6.0s; animation-delay:0.9s; }
    .sp:nth-child(31) { left: 25%; top: 8%;  font-size:28px;  animation-duration:5.3s; animation-delay:2.4s; }
    .sp:nth-child(32) { left: 70%; top:50%;  font-size:16px;  animation-duration:4.8s; animation-delay:1.2s; }
    .sp:nth-child(33) { left:  8%; top:55%;  font-size:24px;  animation-duration:6.6s; animation-delay:3.6s; }
    .sp:nth-child(34) { left: 47%; top:32%;  font-size:18px;  animation-duration:5.0s; animation-delay:0.6s; }
    .sp:nth-child(35) { left: 92%; top:75%;  font-size:22px;  animation-duration:4.4s; animation-delay:2.9s; }

    @keyframes sp-anim {
      0%   { opacity:0;   transform:translateY(0)     scale(0) rotate(0deg);   }
      20%  { opacity:1;   }
      50%  { opacity:0.6; transform:translateY(-18px) scale(1) rotate(180deg); }
      80%  { opacity:1;   }
      100% { opacity:0;   transform:translateY(-38px) scale(0) rotate(360deg); }
    }

    /* ── Container ── */
    .container {
      width: 100%;
      max-width: 400px;
      position: relative;
      z-index: 2;
      padding: 44px 24px 0;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 14px; }

    .subtitle {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.44em;
      text-transform: uppercase;
      /* 밝은 배경에서 확실히 보이도록: 어두운 골드만 사용 */
      background: linear-gradient(90deg,
        #4A2E00 0%,
        #8B6200 18%,
        #C09825 45%,
        #E8B830 50%,
        #C09825 55%,
        #8B6200 82%,
        #4A2E00 100%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes shimmer {
      0%   { background-position: 0%   center; }
      100% { background-position: 220% center; }
    }

    .logo-wrap { display: inline-block; position: relative; }

    /* 로즈골드 빛 반사 — 정적 글로우 */
    .logo-wrap::before {
      content: '';
      position: absolute;
      inset: -10px -20px;
      background: radial-gradient(ellipse,
        rgba(242,191,172,0.40) 0%,
        transparent 65%
      );
      pointer-events: none;
    }

    /* 로고 아래 드롭섀도 */
    .logo-wrap::after {
      content: '';
      position: absolute;
      bottom: 34px; left: 20%;
      width: 60%; height: 5px;
      background: radial-gradient(ellipse, rgba(115,59,47,0.13) 0%, transparent 70%);
      filter: blur(3px);
    }

    .logo { width: 260px; height: auto; display: block; margin-bottom: -55px; }

    /* ── Gold divider ── */
    .gold-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
    }
    .gold-divider::before,
    .gold-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
        transparent, var(--p-terracotta), var(--gold-mid), var(--p-terracotta), transparent
      );
      opacity: 0.55;
    }
    .gold-divider .ornament {
      font-size: 7px;
      letter-spacing: 5px;
      background: linear-gradient(90deg,
        var(--gold-warm), var(--gold-mid), var(--gold-light), var(--gold-mid), var(--gold-warm)
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 5s linear infinite;
    }

    /* ── Description ── */
    .description {
      text-align: center;
      font-size: 13.5px;
      font-weight: 300;
      color: var(--p-brown);
      line-height: 2.4;
      margin-bottom: 36px;
      letter-spacing: 0.04em;
    }

    /* ── Brand Marquee ── */
    .marquee-section {
      margin: 0 0 36px;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 8%, #000 92%, transparent 100%);
      padding: 6px 0;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 32s linear infinite;
      align-items: center;
    }
    .marquee-track:hover { animation-play-state: paused; }

    .marquee-list {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      padding: 0;
      list-style: none;
    }

    .marquee-item {
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
    }

    .marquee-logo {
      height: 20px !important; /* 인라인 height 무시하고 통일 */
      width: auto !important;
      max-width: 110px;
      object-fit: contain;
      filter: grayscale(1) contrast(1.3);
      mix-blend-mode: multiply;
      opacity: 0.65;
      display: block;
    }

    .marquee-text-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--p-brown);
      opacity: 0.75;
      white-space: nowrap;
    }

    .marquee-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--p-terracotta);
      flex-shrink: 0;
      opacity: 0.55;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── Buttons ── */
    .buttons { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: block;
      width: 100%;
      padding: 20px 28px;
      text-align: center;
      text-decoration: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.09em;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
    }

    /* 스윕 샤인 */
    .btn::after {
      content: '';
      position: absolute;
      top: -10%; left: -80%;
      width: 50%; height: 120%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-18deg);
    }
    .btn:hover::after { left: 160%; transition: left 0.55s ease; }

    .btn-label {
      display: block;
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    /* ── Primary: #733B2F 딥브라운 + 골드 블링 ── */
    .btn-primary {
      background: linear-gradient(145deg,
        #5A2820 0%,
        var(--p-dark) 40%,
        #8A4535 60%,
        var(--p-dark) 80%,
        #5A2820 100%
      );
      color: var(--gold-light);
      border: 1px solid rgba(212,175,55,0.50);
      border-top: 1px solid rgba(245,225,120,0.70);
      animation: btn-breathe 3s ease-in-out infinite alternate;
    }

    @keyframes btn-breathe {
      from {
        box-shadow:
          inset 0 1px 0 rgba(245,225,120,0.22),
          0 6px 28px rgba(115,59,47,0.35),
          0 0 18px rgba(212,175,55,0.22);
      }
      to {
        box-shadow:
          inset 0 1px 0 rgba(245,225,120,0.28),
          0 6px 32px rgba(115,59,47,0.45),
          0 0 40px rgba(212,175,55,0.42),
          0 0 75px rgba(212,175,55,0.14);
      }
    }

    .btn-primary .btn-label {
      background: linear-gradient(90deg, var(--gold-warm), var(--gold-light), var(--gold-warm));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      animation: none;
      box-shadow:
        inset 0 1px 0 rgba(245,225,120,0.32),
        0 8px 36px rgba(115,59,47,0.50),
        0 0 56px rgba(212,175,55,0.55);
    }

    /* ── Secondary: 로즈골드 글래스 ── */
    .btn-secondary {
      background: linear-gradient(145deg,
        rgba(242,191,172,0.45) 0%,
        rgba(217,151,113,0.35) 50%,
        rgba(242,191,172,0.40) 100%
      );
      color: var(--p-dark);
      border: 1px solid rgba(166,105,83,0.45);
      border-top: 1px solid rgba(242,191,172,0.80);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        inset 0 1px 0 rgba(255,235,220,0.60),
        0 4px 18px rgba(115,59,47,0.12);
    }

    .btn-secondary .btn-label { color: var(--p-brown); }

    .btn-secondary:hover {
      transform: translateY(-3px);
      border-color: rgba(212,175,55,0.55);
      border-top-color: rgba(245,225,120,0.75);
      box-shadow:
        inset 0 1px 0 rgba(255,235,220,0.70),
        0 0 22px rgba(212,175,55,0.25),
        0 6px 24px rgba(115,59,47,0.20);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 52px;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--p-brown);
      opacity: 0.55;
    }
    .footer::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-warm), transparent);
      margin: 12px auto 0;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- 스크롤 연동 골드 광택 레이어 -->
  <div class="sheen-layer" aria-hidden="true"></div>

  <!-- SVG grain: 미세 메탈릭 텍스처 -->
  <svg class="grain" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <filter id="gf" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.65 0.004"
                    numOctaves="4" seed="5"
                    stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#gf)"/>
  </svg>

  <div class="top-band" aria-hidden="true"></div>

  <div class="sparkles" aria-hidden="true">
    <span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span>
    <span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span>
    <span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span>
    <span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span>
    <span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span>
    <span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span>
    <span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span><span class="sp">✧</span><span class="sp">✦</span>
  </div>

  <div class="container">

    <header class="header">
      <span class="subtitle">나만의 프라이빗 쇼핑몰</span>
      <div class="logo-wrap">
        <img src="gloria-logo.png" alt="Gloria" class="logo">
      </div>
    </header>

    <div class="gold-divider">
      <span class="ornament">✦ ✦ ✦</span>
    </div>

    <p class="description">
      글로리아 밴드에 가입하시면<br>
      정품 병행수입의류, 유명브랜드 골프웨어를<br>
      특별한 회원가로 구입하실 수 있습니다.
    </p>

    <div class="marquee-section">
      <div class="marquee-track">
        <ul class="marquee-list">
          <li class="marquee-item"><img class="marquee-logo" src="logos/titleist.svg" alt="Titleist"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><span class="marquee-text-brand">FootJoy</span></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/callaway.svg" alt="Callaway" style="height:28px;"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/taylormade.svg" alt="TaylorMade"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><span class="marquee-text-brand">Cutter &amp; Buck</span></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/ralphlauren.png" alt="Polo Ralph Lauren" style="height:56px;"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/ami.png" alt="AMI Paris" style="height:28px;"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/stussy.png" alt="Stüssy" style="height:32px;"></li><span class="marquee-dot"></span>

  <script>
    /* 스크롤 시 골드 광택 레이어 이동 — 금속 빛 반사 느낌 */
    (function() {
      var sheen = document.querySelector('.sheen-layer');
      if (!sheen) return;
      var ticking = false;
      window.addEventListener('scroll', function() {
        if (!ticking) {
          requestAnimationFrame(function() {
            var y = window.scrollY;
            sheen.style.transform = 'translateY(' + (y * 0.18) + 'px) translateX(' + (y * 0.04) + 'px)';
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });
    })();
  </script>
