<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤실장 | 골프웨어 & 수입 의류</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #F7F3F0;
      color: #1A1A1A;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 24px 80px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 44px;
    }

    .logo {
      width: 200px;
      height: auto;
      margin: 20px auto 0;
      display: block;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      /* rose gold metallic */
      background: linear-gradient(135deg, #C9868A 0%, #E8C4A0 40%, #B76E79 70%, #D4A5A5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 1px 3px rgba(160, 80, 90, 0.35));
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 13.5px;
      font-weight: 400;
      color: #3A3A3A;
      letter-spacing: 0.05em;
      line-height: 2;
    }

    /* ── Divider ── */
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #C9A96E, #E8C84A, #C9A96E, transparent);
      margin: 36px auto;
    }

    /* ── Trust copy ── */
    .trust {
      text-align: center;
      font-size: 14px;
      font-weight: 400;
      color: #2A2A2A;
      line-height: 2.2;
      margin-bottom: 44px;
      letter-spacing: 0.02em;
    }

    .trust strong {
      font-weight: 600;
      color: #111;
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 19px 24px;
      text-align: center;
      text-decoration: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
    }

    .btn-label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── 카카오톡: 골드 글래스 (1순위) ── */
    .btn-primary {
      background: linear-gradient(135deg,
        rgba(255, 235, 120, 0.45) 0%,
        rgba(220, 175, 40, 0.35) 50%,
        rgba(200, 155, 20, 0.4) 100%
      );
      color: #1A1200;
      border: 1px solid rgba(220, 185, 60, 0.8);
      border-top: 1px solid rgba(255, 245, 160, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,248,180,0.6),
        0 4px 20px rgba(200,160,20,0.3),
        0 1px 4px rgba(160,120,0,0.15);
    }

    .btn-primary .btn-label {
      color: rgba(100, 70, 0, 0.7);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg,
        rgba(255, 242, 140, 0.55) 0%,
        rgba(230, 185, 50, 0.45) 50%,
        rgba(210, 165, 30, 0.5) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,248,180,0.7),
        0 6px 24px rgba(200,160,20,0.4);
      transform: translateY(-1px);
    }

    /* ── 쿠폰: 실버골드 메탈 글래스 ── */
    .btn-secondary {
      background: linear-gradient(135deg,
        rgba(230, 225, 210, 0.55) 0%,
        rgba(200, 190, 160, 0.4) 50%,
        rgba(180, 168, 130, 0.45) 100%
      );
      color: #1A1500;
      border: 1px solid rgba(210, 195, 150, 0.8);
      border-top: 1px solid rgba(250, 245, 220, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,250,220,0.7),
        0 4px 18px rgba(160,140,80,0.2),
        0 1px 4px rgba(120,100,40,0.12);
    }

    .btn-secondary .btn-label {
      color: rgba(80, 68, 20, 0.6);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg,
        rgba(238, 232, 215, 0.65) 0%,
        rgba(210, 200, 168, 0.5) 50%,
        rgba(190, 178, 138, 0.55) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,250,220,0.8),
        0 6px 22px rgba(160,140,80,0.28);
      transform: translateY(-1px);
    }

    /* 쿠폰 왼쪽 빨강 포인트 */
    .btn-accent-line {
      border-left: 3px solid rgba(200, 30, 50, 0.7);
    }

    /* ── 쇼핑몰: 골드 + 로즈골드 혼합 글래스 ── */
    .btn-shop {
      background: linear-gradient(135deg,
        rgba(255, 235, 120, 0.28) 0%,
        rgba(230, 175, 185, 0.25) 100%
      );
      color: #1A1000;
      border: 1px solid rgba(215, 168, 100, 0.6);
      border-top: 1px solid rgba(255, 240, 180, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,245,200,0.45),
        0 3px 14px rgba(160,120,60,0.15);
    }

    .btn-shop .btn-label {
      color: rgba(100, 70, 20, 0.6);
    }

    .btn-shop:hover {
      background: linear-gradient(135deg,
        rgba(255, 240, 130, 0.38) 0%,
        rgba(235, 185, 195, 0.32) 100%
      );
      transform: translateY(-1px);
    }

    /* ── 블로그: 준비 중 (페이드 글래스) ── */
    .btn-ghost {
      background: rgba(255, 255, 255, 0.15);
      color: #AAA;
      border: 1px solid rgba(200, 190, 185, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 12.5px;
      letter-spacing: 0.05em;
    }

    .btn-ghost .btn-label {
      color: #C0B8B4;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(215, 168, 100, 0.5);
      color: #888;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 52px;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #C9A96E, #E8C84A, #C9A96E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
  <div class="container">

    <header class="header">
      <p class="name">윤실장</p>
      <p class="tagline">
        골프웨어 &amp; 해외 직수입 의류<br>
        정품만, 4년째
      </p>
      <img src="gloria-logo.png" alt="Gloria" class="logo">
    </header>

    <div class="divider"></div>

    <p class="trust">
      타이틀리스트, 폴로랄프로렌, AMI, 꼼데가르송—<br>
      <strong>직수입 정품</strong>을 <strong>멤버 전용 가격</strong>으로.<br>
      걱정은 내려놓고, 먼저 물어봐요.
    </p>

    <div class="buttons">

      <a href="http://pf.kakao.com/_xofhxlX" class="btn btn-primary" target="_blank" rel="noopener">
        <span class="btn-label">문의 · 상담</span>
        카카오톡 채널로 연결하기
      </a>

      <a href="#" class="btn btn-secondary btn-accent-line">
        <span class="btn-label">신규 멤버 혜택</span>
        첫 구매 쿠폰 받기
      </a>

      <a href="https://insio.co.kr/m/gloria" class="btn btn-shop" target="_blank" rel="noopener">
        <span class="btn-label">쇼핑몰</span>
        상품 둘러보기
      </a>

      <a href="#" class="btn btn-ghost">
        <span class="btn-label">coming soon</span>
        블로그 · 착용 후기
      </a>

    </div>

    <footer class="footer">
      <p>© 2026 Gloria · 글로리아</p>
    </footer>

  </div>
</body>
</html>
