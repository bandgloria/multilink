<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>윤실장 | 골프웨어 & 수입 의류</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #F7F3F0;
      color: #1A1A1A;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 24px 80px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #8A7055;
      margin-bottom: 20px;
    }

    .logo {
      width: 200px;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    /* ── Description ── */
    .description {
      text-align: center;
      font-size: 13.5px;
      font-weight: 400;
      color: #3A3A3A;
      line-height: 2.2;
      margin-bottom: 40px;
      letter-spacing: 0.03em;
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 19px 24px;
      text-align: center;
      text-decoration: none;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
    }

    .btn-label {
      display: block;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    /* ── 카카오톡: 골드 글래스 (1순위) ── */
    .btn-primary {
      background: linear-gradient(135deg,
        rgba(255, 235, 120, 0.45) 0%,
        rgba(220, 175, 40, 0.35) 50%,
        rgba(200, 155, 20, 0.4) 100%
      );
      color: #1A1200;
      border: 1px solid rgba(220, 185, 60, 0.8);
      border-top: 1px solid rgba(255, 245, 160, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,248,180,0.6),
        0 4px 20px rgba(200,160,20,0.3),
        0 1px 4px rgba(160,120,0,0.15);
    }

    .btn-primary .btn-label {
      color: rgba(100, 70, 0, 0.7);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg,
        rgba(255, 242, 140, 0.55) 0%,
        rgba(230, 185, 50, 0.45) 50%,
        rgba(210, 165, 30, 0.5) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,248,180,0.7),
        0 6px 24px rgba(200,160,20,0.4);
      transform: translateY(-1px);
    }

    /* ── 쿠폰: 실버골드 메탈 글래스 ── */
    .btn-secondary {
      background: linear-gradient(135deg,
        rgba(230, 225, 210, 0.55) 0%,
        rgba(200, 190, 160, 0.4) 50%,
        rgba(180, 168, 130, 0.45) 100%
      );
      color: #1A1500;
      border: 1px solid rgba(210, 195, 150, 0.8);
      border-top: 1px solid rgba(250, 245, 220, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow:
        inset 0 1px 0 rgba(255,250,220,0.7),
        0 4px 18px rgba(160,140,80,0.2),
        0 1px 4px rgba(120,100,40,0.12);
    }

    .btn-secondary .btn-label {
      color: rgba(80, 68, 20, 0.6);
    }

    .btn-secondary:hover {
      background: linear-gradient(135deg,
        rgba(238, 232, 215, 0.65) 0%,
        rgba(210, 200, 168, 0.5) 50%,
        rgba(190, 178, 138, 0.55) 100%
      );
      box-shadow:
        inset 0 1px 0 rgba(255,250,220,0.8),
        0 6px 22px rgba(160,140,80,0.28);
      transform: translateY(-1px);
    }


    /* ── Brand Marquee ── */
    .marquee-section {
      margin: 0 -24px 40px;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee 32s linear infinite;
      align-items: center;
    }

    .marquee-track:hover {
      animation-play-state: paused;
    }

    .marquee-list {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      padding: 6px 0;
    }

    .marquee-item {
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
    }

    .marquee-logo {
      height: 20px;
      width: auto;
      max-width: 110px;
      object-fit: contain;
      filter: grayscale(1) contrast(1.05);
      opacity: 0.5;
      display: block;
      mix-blend-mode: multiply;
    }

    .marquee-text-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13.5px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #7A6A58;
      opacity: 0.7;
      white-space: nowrap;
    }

    .marquee-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C9A96E, #E8C84A);
      flex-shrink: 0;
      opacity: 0.6;
    }

    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 52px;
      font-size: 10.5px;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #C9A96E, #E8C84A, #C9A96E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>

          <li class="marquee-item"><img class="marquee-logo" src="logos/ami.png" alt="AMI Paris" style="height:28px;"></li><span class="marquee-dot"></span>

          <li class="marquee-item"><img class="marquee-logo" src="logos/cdg.svg" alt="Comme des Garçons"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/lacoste.svg" alt="Lacoste" style="height:10px;"></li><span class="marquee-dot"></span>

          <li class="marquee-item"><img class="marquee-logo" src="logos/saintlaurent.png" alt="Saint Laurent" style="height:15px;"></li><span class="marquee-dot"></span>
          <li class="marquee-item"><img class="marquee-logo" src="logos/ck.png" alt="Calvin Klein" style="height:13px;"></li><span class="marquee-dot"></span>
        </ul>
      </div>
    </div>

    <div class="buttons">

      <a href="https://band.us/n/a9acb341Q6xbg" class="btn btn-primary" target="_blank" rel="noopener">

    <footer class="footer">

</body>
</html>
